<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="imagem-container">
            <img src="Imagem do WhatsApp de 2025-06-26 à(s) 14.32.07_289297a5.jpg" alt="Foto principal" class="imagem-principal">

            <!-- TEXTO DIGITADO EM CIMA DA IMAGEM -->
            <h2 id="texto-digitado" class="texto-sobre-imagem"></h2>

            <!-- DATA DE NASCIMENTO -->
            <p class="data-nascimento">19/03/2009</p>
        </div>

        <div class="opcoes">
            <div class="opcao" onclick="window.open('https://playvalorant.com/pt-br')">
                <img src="Imagem do WhatsApp de 2025-07-02 à(s) 16.27.11_81fbd6a9.jpg" alt="Jogar">
                <p>Jogar</p>
            </div>

            <div class="opcao" onclick="window.open('https://pt.wikipedia.org/wiki/Estádio_Major_Antônio_Couto_Pereira')">

                <p>Couto Pereira</p>
            </div>

            <div class="opcao" onclick="window.open('https://open.spotify.com/intl-pt')">
                <img src="Imagem do WhatsApp de 2025-07-02 à(s) 16.26.26_28d126bd.jpg" alt="Músicas">
                <p>Músicas</p>
            </div>

            <div class="opcao" onclick="window.open('https://www.netflix.com/search?q=d')">

                <p>Filmes</p>

        </div>

    <script src="script.js"></script>

</html>
