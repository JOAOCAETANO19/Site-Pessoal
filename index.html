<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Faixa azul escuro no topo -->
    <header>
        <h1 class="typing"></h1>
    </header>

    <!-- Foto principal + data -->
    <section class="principal-container fade-in">
        <img src="principal.jpg" alt="Minha Foto" class="principal">
        <p class="data">19/03/2009</p>
    </section>

    <!-- Cards -->
    <section class="cards">

        <div class="item fade-in">
            <img src="couto.jpg" alt="Couto Pereira">
            <h3>Ir ao Couto Pereira</h3>
        </div>

        <div class="item fade-in">
            <img src="musica.jpg" alt="Músicas">
            <h3>Escutar Músicas</h3>
        </div>

        <div class="item fade-in">
            <img src="filmes.jpg" alt="Filmes">
            <h3>Assistir Filmes</h3>
        </div>

        <div class="item fade-in">
            <img src="jogar.jpg" alt="Jogar">
            <h3>Jogar</h3>
        </div>

    </section>

    <script src="script.js"></script>
</body>
</html>
