<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esse Sou Eu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    Esse Sou Eu
    <div class="icons">
      <a href="https://www.whatsapp.com/?lang=pt" target="_blank">
        <img src="whatsapp.png" alt="WhatsApp">
      </a>
      <a href="https://www.instagram.com" target="_blank">
        <img src="instagram.png" alt="Instagram">
      </a>
      <a href="https://www.facebook.com/?locale=pt_BR" target="_blank">
        <img src="facebook.png" alt="Facebook">
      </a>
    </div>
  </header>

  <!-- FRASE PRINCIPAL -->
  <h1 id="typewriter" class="fade-item"></h1>

  <!-- NOME PEQUENO COM MÁQUINA DE ESCREVER -->
  <h3 id="subTypewriter" class="fade-item"></h3>

  <div class="foto fade-item">
    <img src="principal.jpg" alt="Foto pessoal">
    <p class="nascimento">Nascimento: <b>19/03/2009</b></p>
  </div>

  <!-- AGORA O TÍTULO DA SEÇÃO COM MÁQUINA DE ESCREVER -->
  <h2 id="typewriterSection" class="fade-item"></h2>

  <div class="gostos">

    <div class="item fade-item">
      <a href="https://www.netflix.com/search?q=d" target="_blank">
        <img src="filmes.jpg" alt="Assistir Filmes">
      </a>
      <p>Assistir Filmes</p>
    </div>

    <div class="item fade-item">
      <a href="https://pt.wikipedia.org/wiki/Est%C3%A1dio_Major_Ant%C3%B4nio_Couto_Pereira" target="_blank">
        <img src="couto.jpg" alt="Ir ao Couto Pereira">
      </a>
      <p>Ir ao Couto Pereira</p>
    </div>

    <div class="item fade-item">
      <a href="https://open.spotify.com/intl-pt" target="_blank">
        <img src="musica.jpg" alt="Escutar Músicas">
      </a>
      <p>Escutar Músicas</p>
    </div>

    <div class="item fade-item">
      <a href="https://playvalorant.com/pt-br" target="_blank">
        <img src="jogar.jpg" alt="Jogar">
      </a>
      <p>Jogar</p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
