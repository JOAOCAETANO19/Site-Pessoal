<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Site</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="social">
      <a href="https://www.facebook.com/?locale=pt_BR" target="_blank">
        <img src="facebook.png" alt="Facebook">
      </a>
      <a href="https://www.whatsapp.com/?lang=pt" target="_blank">
        <img src="whatsapp.png" alt="WhatsApp">
      </a>
      <a href="https://www.instagram.com" target="_blank">
        <img src="instagram.png" alt="Instagram">
      </a>
    </div>
  </header>

  <main>
    <div class="foto">
      <img src="principal.jpg" alt="Minha imagem principal">
      <p class="data-nascimento">19/03/2009</p>
    </div>

    <section class="gostos">
      <div class="item">
        <a href="https://playvalorant.com/pt-br" target="_blank">
          <img src="jogar.jpg" alt="Jogar">
          <p>Jogar</p>
        </a>
      </div>

      <div class="item">
        <a href="https://pt.wikipedia.org/wiki/Estádio_Major_Antônio_Couto_Pereira" target="_blank">
          <img src="couto.jpg" alt="Couto Pereira">
          <p>Couto Pereira</p>
        </a>
      </div>

      <div class="item">
        <a href="https://open.spotify.com/intl-pt" target="_blank">
          <img src="musica.jpg" alt="Músicas">
          <p>Músicas</p>
        </a>
      </div>

      <div class="item">
        <a href="https://www.netflix.com/search?q=d" target="_blank">
          <img src="filmes.jpg" alt="Filmes">
          <p>Filmes</p>
        </a>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
