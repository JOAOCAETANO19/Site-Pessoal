<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="social">
            <a href="https://www.facebook.com/?locale=pt_BR" target="_blank">
                <img src="facebook.png" alt="Facebook">
            </a>
            <a href="https://www.instagram.com" target="_blank">
                <img src="instagram.png" alt="Instagram">
            </a>
            <a href="https://www.whatsapp.com/?lang=pt" target="_blank">
                <img src="whatsapp.png" alt="WhatsApp">
            </a>
        </div>
    </header>

    <main>

        <h1 id="typing"></h1>

        <div class="principal fade-in">
            <img src="principal.jpg" alt="Minha Foto">
            <p class="nascimento">Nascimento: <strong>19/03/2009</strong></p>
        </div>

        <div class="opcoes">

            <a href="https://pt.wikipedia.org/wiki/Estádio_Major_Antônio_Couto_Pereira" target="_blank">
                <img src="coutop.png" class="foto fade-in" alt="Couto Pereira">
                <p>Couto Pereira</p>
            </a>

            <a href="https://open.spotify.com/intl-pt" target="_blank">
                <img src="musicas.png" class="foto fade-in" alt="Músicas">
                <p>Músicas</p>
            </a>

            <a href="https://www.netflix.com/search?q=d" target="_blank">
                <img src="filmes.png" class="foto fade-in" alt="Filmes">
                <p>Filmes</p>
            </a>

            <a href="https://playvalorant.com/pt-br" target="_blank">
                <img src="jogar.png" class="foto fade-in" alt="Jogar">
                <p>Jogar</p>
            </a>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
