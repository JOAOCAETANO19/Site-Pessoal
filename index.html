<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Esse Sou Eu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="top-inner">
      <div class="title">Esse Sou Eu</div>

      <div class="icons">
        <a href="https://www.whatsapp.com/?lang=pt" target="_blank"><img src="whatsapp.png" alt="WhatsApp"></a>
        <a href="https://www.instagram.com" target="_blank"><img src="instagram.png" alt="Instagram"></a>
        <a href="https://www.facebook.com/?locale=pt_BR" target="_blank"><img src="facebook.png" alt="Facebook"></a>
      </div>
    </div>
  </header>

  <main>
    <!-- máquina de escrever: título -->
    <h1 id="typewriter" class="fade-item"></h1>

    <!-- máquina de escrever: nome pequeno -->
    <h3 id="subTypewriter" class="fade-item"></h3>

    <!-- foto principal (3D + fade) -->
    <section class="hero fade-item">
      <div class="foto">
        <img src="principal.jpg" alt="Foto pessoal">
      </div>
      <p class="nascimento">19/03/2009 — Minha data de nascimento</p>
    </section>

    <!-- título da seção com máquina de escrever -->
    <h2 id="typewriterSection" class="fade-item"></h2>

    <!-- espaço extra antes das imagens: 180px (via CSS .favorites-section) -->
    <section class="favorites-section">
      <div class="gostos">
        <div class="item fade-item">
          <a href="https://www.netflix.com/search?q=d" target="_blank">
            <img src="filmes.jpg" alt="Assistir Filmes">
            <p>Assistir Filmes</p>
          </a>
        </div>

        <div class="item fade-item">
          <a href="https://pt.wikipedia.org/wiki/Est%C3%A1dio_Major_Ant%C3%B4nio_Couto_Pereira" target="_blank">
            <img src="couto.jpg" alt="Ir ao Couto Pereira">
            <p>Ir ao Couto Pereira</p>
          </a>
        </div>

        <div class="item fade-item">
          <a href="https://open.spotify.com/intl-pt" target="_blank">
            <img src="musica.jpg" alt="Escutar Músicas">
            <p>Escutar Músicas</p>
          </a>
        </div>

        <div class="item fade-item">
          <a href="https://playvalorant.com/pt-br" target="_blank">
            <img src="jogar.jpg" alt="Jogar">
            <p>Jogar</p>
          </a>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
